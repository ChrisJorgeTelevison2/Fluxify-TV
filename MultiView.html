<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxify MultiView</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

select, button {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.stream-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
  gap: 15px;
}

.stream-card {
  position: relative;
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow: hidden;
  background: #111827;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.remove {
  position: absolute;
  top: 10px;
  right: 10px;
  background: red;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🎥 Fluxify MultiView Selector</h1>

<div class="controls">
  <select id="streamSelect">
    <option value="https://chrisjorgetelevison2.github.io/Fluxify-TV/CAZE%20TV(EVENTOS%201).html">
      CAZE TV (EVENTOS 1)
    </option>

    <option value="https://chrisjorgetelevison2.github.io/Fluxify-TV/Tudn(Canal).html">
      TUDN Canal
    </option>

    <option value="https://chrisjorgetelevison2.github.io/Fluxify-TV/Peacock.html">
      Peacock
    </option>

    <option value="https://chrisjorgetelevison2.github.io/Fluxify-TV/Peacock2.html">
      Peacock 2
    </option>
  </select>

  <button onclick="addStream()">Add Stream</button>
</div>

<div class="stream-grid" id="grid"></div>

<script>
function addStream() {
  const url = document.getElementById("streamSelect").value;

  const card = document.createElement("div");
  card.className = "stream-card";

  card.innerHTML = `
    <button class="remove">✕</button>
    <iframe src="${url}" allowfullscreen></iframe>
  `;

  card.querySelector(".remove").onclick = () => card.remove();

  document.getElementById("grid").appendChild(card);
}
</script>

</body>
</html>
