<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0f1e;
  color: #fff;
}

/* HERO */
.hero {
  position: relative;
  height: 60vh;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.2)),
              url('https://images.unsplash.com/photo-1601944177325-f8867652837f?q=80&w=1470') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 20px;
}

.hero h1 {
  font-size: 48px;
  margin: 0;
}

.hero p {
  color: #ccc;
  margin: 10px 0 20px;
  font-size: 18px;
}

/* BUTTON */
.discord-btn {
  display: inline-block;
  padding: 14px 28px;
  border-radius: 50px;
  background: linear-gradient(135deg,#1f80e0,#3aa0ff);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s;
}

.discord-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(31,128,224,0.6);
}

/* CATEGORIES */
.categories {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 20px;
  background: #101728;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.cat-btn {
  padding: 10px 20px;
  border-radius: 25px;
  background: #1a2030;
  border: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  white-space: nowrap;
  font-weight: 500;
  transition: 0.3s;
  color: #ccc;
}

.cat-btn.active, .cat-btn:hover {
  background: #1f80e0;
  color: #fff;
}

/* GRID OF CHANNELS */
.section {
  padding: 30px 20px;
}

.row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 20px;
}

.card {
  background: #141b2d;
  border-radius: 12px;
  text-decoration: none;
  overflow: hidden;
  transition: 0.3s;
  text-align: center;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  padding: 15px;
  background: #000;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.channel-name {
  padding: 10px;
  font-weight: 600;
}

/* HIDE CLASS */
.hidden { display: none !important; }

/* MOBILE */
@media(max-width:768px) {
  .hero h1 { font-size: 32px; }
  .hero p { font-size: 16px; }
  .row { grid-template-columns: repeat(2,1fr); }
}

</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>Bienvenido a Live TV</h1>
    <p>Explora tus canales favoritos: USA, Latino, Deportes y Kids</p>
    <a class="discord-btn" href="https://chris-jorge-televison2-e50ed69d.base44.app/live" target="_blank">Únete a Discord</a>
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <div class="cat-btn active" onclick="filterCards('all', this)">Todos</div>
  <div class="cat-btn" onclick="filterCards('usa', this)">USA</div>
  <div class="cat-btn" onclick="filterCards('latino', this)">Latino</div>
  <div class="cat-btn" onclick="filterCards('sports', this)">Deportes</div>
  <div class="cat-btn" onclick="filterCards('kids', this)">Kids</div>
</div>

<!-- CHANNELS -->
<div class="section">
  <div class="row">
    <!-- USA -->
    <a class="card usa" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/ABC7_New_York_logo.png" alt="ABC 7">
      <div class="channel-name">ABC 7</div>
    </a>

    <!-- LATINO -->
    <a class="card latino" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Ecuavisa_Logo_2019.png" alt="Ecuavisa">
      <div class="channel-name">Ecuavisa</div>
    </a>

    <!-- KIDS -->
    <a class="card kids" href="#">
      <img src="https://1000logos.net/wp-content/uploads/2021/08/Nick-Jr.-Logo.png" alt="Nick Jr">
      <div class="channel-name">Nick Jr</div>
    </a>

    <a class="card kids" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Nickelodeon_2023_logo.svg" alt="Nickelodeon">
      <div class="channel-name">Nickelodeon</div>
    </a>

    <!-- SPORTS -->
    <a class="card sports" href="#">
      <img src="https://logos-world.net/wp-content/uploads/2020/01/ESPN-Logo.png" alt="ESPN">
      <div class="channel-name">ESPN</div>
    </a>

    <a class="card sports" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN2_logo.png" alt="ESPN 2">
      <div class="channel-name">ESPN 2</div>
    </a>

    <a class="card sports" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/ESPN3_Logo.png" alt="ESPN 3">
      <div class="channel-name">ESPN 3</div>
    </a>

    <a class="card sports" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/ESPN4_logo.png" alt="ESPN 4">
      <div class="channel-name">ESPN 4</div>
    </a>

    <a class="card sports" href="#">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/ESPN5_logo.png" alt="ESPN 5">
      <div class="channel-name">ESPN 5</div>
    </a>
  </div>
</div>

<script>
function filterCards(category, el) {
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if(category === 'all' || card.classList.contains(category)) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
  el.classList.add('active');
}
</script>

</body>
</html>
