<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live TV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05070d;
  --accent:#1f80e0;
  --muted:#a9b3c7;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background: radial-gradient(circle at top, #0b1220, var(--bg));
  color:#fff;
  overflow-x:hidden;
}

/* HERO */
.hero{
  position:relative;
  height:70vh;
  display:flex;
  align-items:flex-end;
  padding:60px 40px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.3)),
    url('https://images.unsplash.com/photo-1601944177325-f8867652837f?q=80&w=1470') center/cover no-repeat;
}

.hero::after{
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(circle at bottom left, rgba(31,128,224,.25), transparent 60%);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:650px;
  backdrop-filter: blur(8px);
  padding:20px;
  border-radius:16px;
}

.hero h1{
  font-size:54px;
  margin:0;
}

.hero p{
  color:var(--muted);
  margin-top:10px;
}

/* BUTTON */
.discord-btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 26px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--accent),#3aa0ff);
  color:#fff;
  text-decoration:none;
  font-weight:600;
}

/* CATEGORY BAR */
.categories{
  display:flex;
  gap:10px;
  padding:16px 20px;
  overflow-x:auto;
  background:rgba(10,15,25,.8);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.cat-btn{
  padding:10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}

.cat-btn.active{
  background:var(--accent);
  color:#fff;
}

/* SECTION */
.section{padding:30px 20px;}

.row{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
}

/* CARD */
.card{
  background:#0f1626;
  border-radius:16px;
  overflow:hidden;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.06);
  transition:.25s;
}

.card:hover{
  transform:scale(1.06);
  border-color:rgba(31,128,224,.6);
  box-shadow:0 18px 40px rgba(0,0,0,.6);
}

.card img{
  width:100%;
  height:120px;
  object-fit:contain;
  background:#000;
  padding:18px;
}

.channel-name{
  padding:12px;
  text-align:center;
  font-weight:600;
}

/* HIDE */
.hidden{display:none !important}

/* MOBILE */
@media(max-width:768px){
.hero{height:60vh;padding:30px 20px;}
.hero h1{font-size:34px;}
.row{grid-template-columns:repeat(2,1fr);}
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>Explora Canales en Vivo</h1>
    <p>USA • Latino • Deportes • Kids</p>

    <a class="discord-btn" href="https://chris-jorge-televison2-e50ed69d.base44.app/live" target="_blank">
      Join Our Discord
    </a>
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <div class="cat-btn active" onclick="filterCards('all',this)">Todos</div>
  <div class="cat-btn" onclick="filterCards('usa',this)">USA</div>
  <div class="cat-btn" onclick="filterCards('latino',this)">Latino</div>
  <div class="cat-btn" onclick="filterCards('sports',this)">Deportes</div>
  <div class="cat-btn" onclick="filterCards('kids',this)">Kids</div>
</div>

<!-- CHANNELS -->
<div class="section">
<div class="row">

<!-- USA -->
<a class="card usa" href="https://chrisjorgetelevison2.blogspot.com/p/abc7-news-new-york.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/ABC7_New_York_logo.png">
  <div class="channel-name">ABC 7</div>
</a>

<!-- LATINO -->
<a class="card latino" href="https://chrisjorgetelevison2.blogspot.com/p/ecuavisa.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Ecuavisa_Logo_2019.png">
  <div class="channel-name">Ecuavisa</div>
</a>

<!-- KIDS -->
<a class="card kids" href="#">
  <img src="https://1000logos.net/wp-content/uploads/2021/08/Nick-Jr.-Logo.png">
  <div class="channel-name">Nick Jr</div>
</a>

<a class="card kids" href="#">
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Nickelodeon_2023_logo.svg">
  <div class="channel-name">Nickelodeon</div>
</a>

<!-- SPORTS -->
<a class="card sports" href="https://chrisjorgetelevison2.github.io/ChrisJorgeTelevision2.com/espn1.html?v=2">
  <img src="https://logos-world.net/wp-content/uploads/2020/01/ESPN-Logo.png">
  <div class="channel-name">ESPN</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn-2.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN2_logo.png">
  <div class="channel-name">ESPN 2</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn3argentinan-channel.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/ESPN3_Logo.png">
  <div class="channel-name">ESPN 3</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn-4-argentinan-channel.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/ESPN4_logo.png">
  <div class="channel-name">ESPN 4</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn-5-argentinan-channel.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/ESPN5_logo.png">
  <div class="channel-name">ESPN 5</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn-6-argentinan-channel.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/ESPN6_logo.png">
  <div class="channel-name">ESPN 6</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/p/espn-7-argentinan-channel.html">
  <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/ESPN7_logo.png">
  <div class="channel-name">ESPN 7</div>
</a>

<a class="card sports" href="https://chrisjorgetelevison2.blogspot.com/">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/ESPN_Premium_logo.svg/1200px-ESPN_Premium_logo.svg.png">
  <div class="channel-name">ESPN Premium</div>
</a>

</div>
</div>

<script>
function filterCards(category,el){
  let cards=document.querySelectorAll('.card');

  cards.forEach(card=>{
    if(category==='all' || card.classList.contains(category)){
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });

  document.querySelectorAll('.cat-btn').forEach(btn=>btn.classList.remove('active'));
  el.classList.add('active');
}
</script>

</body>
</html>
