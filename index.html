<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0f1e;
  color: #fff;
}

/* HERO */
.hero {
  height: 60vh;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.2)),
              url('https://images.unsplash.com/photo-1601944177325-f8867652837f?q=80&w=1470') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
}

/* EVENTS */
.events-section {
  padding: 25px 20px;
}

.events-row {
  display: flex;
  gap: 18px;
  overflow-x: auto;
}

.event-card {
  min-width: 240px;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  transition: 0.3s;
}

.event-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.event-card:hover {
  transform: scale(1.05);
}

/* CHANNELS */
.section {
  padding: 30px 20px;
}

.row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 20px;
}

.card {
  background: #141b2d;
  border-radius: 12px;
  text-align: center;
  text-decoration: none;
  overflow: hidden;
  transition: 0.3s;
  color: #fff;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  padding: 15px;
  background: #000;
}

.card:hover {
  transform: scale(1.05);
}

/* MULTIVIEW */
.multiview-btn {
  position: fixed;
  bottom: 22px;
  right: 22px;
  padding: 14px 18px;
  border-radius: 50px;
  background: #1f80e0;
  color: white;
  text-decoration: none;
  font-weight: 600;
  z-index: 999;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 18px;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  border-top: 1px solid rgba(255,255,255,0.08);
  margin-top: 40px;
}
</style>
</head>
